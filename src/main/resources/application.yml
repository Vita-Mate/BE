# default
spring:
  profiles:
    active: dev
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/vitamate
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: never
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000
  jwt:
    secret: ${JWT_SECRET}

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
      enabled: true

cloud:
  aws:
    s3:
      bucket: vitamate-dev
      path:
        challenge: challenge
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_ACCESS_KEY_ID}
      secretKey: ${AWS_SECRET_ACCESS_KEY}

api:
  key: ${API_KEY}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${RDS_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${RDS_DB_USERNAME}
    password: ${RDS_DB_PASSWORD}
  sql:
    init:
      mode: never
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000

  jackson:
    time-zone: Asia/Seoul

